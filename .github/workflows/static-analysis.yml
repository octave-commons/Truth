name: static-analysis

# Deterministic, rule-based code-quality gate. Mirrors `bin/analyze --strict`.
# Blocking: clj-kondo errors, structural HARD breaches, architecture invariants.
# Advisory (reported, non-blocking): Splint, cljfmt, jscpd, dead-code.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clojure tooling
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          clj-kondo: latest
          clojure-lsp: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
          key: deps-${{ hashFiles('deps.edn') }}

      # Blocking gate: bugs + structural decay (HARD thresholds).
      - name: Static analysis (strict)
        run: ./bin/analyze --strict

      # Architecture invariants (single ECS substrate, one-way deps, etc.).
      - name: Architecture invariants
        run: clojure -M:test -n architecture-test
